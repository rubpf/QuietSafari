name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v0.3.0. Empty uses MARKETING_VERSION."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ad-hoc app, zip, and disk image
        run: bash scripts/build_release.sh

      - name: Choose the release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            name="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            name="${{ inputs.tag }}"
          else
            version="$(sed -n 's/^MARKETING_VERSION = //p' Config/Shared.xcconfig | tr -d '[:space:]')"
            name="v${version}"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${name}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          notes="$(mktemp)"
          {
            echo "QuietSafari ${TAG}, ad-hoc signed. No paid Apple Developer account."
            echo
            echo "After download, clear quarantine once:"
            echo
            echo '```'
            echo "xattr -dr com.apple.quarantine /path/to/QuietSafari.app"
            echo '```'
            echo
            echo "Homebrew: \`brew install --cask --no-quarantine rubpf/tap/quietsafari\`"
            echo
            echo "SHA256"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > "$notes"
          # Beta, alpha, rc, and pre tags stay pre-releases so they do not replace "latest".
          extra=(--latest)
          if [[ "$TAG" == *beta* || "$TAG" == *alpha* || "$TAG" == *rc* || "$TAG" == *pre* ]]; then
            extra=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/QuietSafari.zip dist/QuietSafari.dmg dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/QuietSafari.zip dist/QuietSafari.dmg dist/SHA256SUMS.txt \
              --title "QuietSafari ${TAG}" \
              --notes-file "$notes" \
              "${extra[@]}"
          fi
